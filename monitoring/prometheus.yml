global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    service:     'retention-core'

# Alert rules file
rule_files:
  - "alerts.yml"

scrape_configs:
  # FastAPI + custom retention metrics
  - job_name: 'retention_core_api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # Redis metrics (via redis-exporter if deployed; else basic)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
