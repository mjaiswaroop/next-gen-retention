services:
  # 1. FastAPI Web Server (Backend API)
  - type: web
    name: anchor-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: "postgresql://postgres:password@db.supabase.co:5432/postgres" # Example placeholder, user will replace with their Supabase connection string
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.1
