apiVersion: apps/v1
kind: Deployment
metadata:
  name: retention-core-api
  namespace: retention-core
  labels:
    app: retention-core-api
    version: "3.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retention-core-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: retention-core-api
        version: "3.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: retention-core:3.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          command: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: retention-core-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: retention-core-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "redpanda-service:9092"
            - name: JAEGER_OTLP_ENDPOINT
              value: "http://jaeger-service:4318/v1/traces"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
            - name: data-storage
              mountPath: /app/data
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: model-pvc
        - name: data-storage
          persistentVolumeClaim:
            claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: retention-core
spec:
  selector:
    app: retention-core-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retention-core-api-hpa
  namespace: retention-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retention-core-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
